
name: Build STYLE VEELLAA APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip -q STYLE_VEELLAA_Android_Project.zip -d project

      - name: Build APK
        run: |
          SETTINGS=$(find project -name settings.gradle -type f | head -n 1)
          cd "$(dirname "$SETTINGS")"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STYLE-VEELLAA-APK
          path: project/**/app/build/outputs/apk/debug/*.apk

